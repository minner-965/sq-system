name: hz-leasing

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: .
      dockerfile: services/demo-dashboard/Dockerfile
    image: hz-leasing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PGBOSS_ENABLED: ${PGBOSS_ENABLED:-true}
      PGBOSS_PROCESS_JOBS: "false"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      DPV_MAINTENANCE_READ_ONLY: ${DPV_MAINTENANCE_READ_ONLY:-false}
      DPV_WORKSPACE_ACTOR: ${DPV_WORKSPACE_ACTOR:-admin}
      DPV_WORKSPACE_ROLE: ${DPV_WORKSPACE_ROLE:-MANAGEMENT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: hz-leasing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      PORT: 3000
      HTTP_LISTEN_ENABLED: "false"
      PGBOSS_ENABLED: "true"
      PGBOSS_PROCESS_JOBS: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p='/tmp/dpv-phase5-worker-ready.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));if(!s.ready||!Array.isArray(s.queues)||!s.queues.length)process.exit(1);process.kill(Number(s.pid),0)"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
