<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布账号 · 恒兆广场招商系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="frame">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content">
      <div class="head">
        <div>
          <h1>发布账号</h1>
          <p id="publisher-line">&nbsp;</p>
          <p class="meta" id="network-line" hidden></p>
        </div>
        <div class="btns">
          <button class="btn pri" type="button" id="open-add" hidden>添加账号</button>
        </div>
      </div>

      <div class="banner" id="error" role="alert" hidden>
        <span id="error-text"></span>
        <button class="btn" type="button" id="retry">重新加载</button>
      </div>
      <div class="notice" id="notice" role="status" hidden></div>

      <section class="card settings" id="add" hidden>
        <div class="ph"><div><h3>添加账号</h3><p>先在这里登记，再点“扫码登录”</p></div></div>
        <form class="pb form-grid" id="add-form">
          <div class="field"><label for="a-platform">平台</label><select id="a-platform" name="platform"><option value="douyin">抖音</option><option value="channels">视频号</option><option value="xiaohongshu">小红书</option><option value="moments">朋友圈</option></select></div>
          <div class="field"><label for="a-purpose">用途</label><select id="a-purpose" name="purpose"><option value="publish">发布内容</option><option value="search">只用来搜索（需求发现用的小号）</option></select></div>
          <div class="field"><label for="a-name">账号名称（自己认得出就行）</label><input id="a-name" name="account_name" maxlength="40" required></div>
          <div class="field"><label for="a-limit">每天最多发几条</label><input id="a-limit" name="daily_limit" type="number" min="1" max="50" value="5" required></div>
          <div class="wide form-actions"><span class="form-error" id="add-error" role="alert"></span><button class="btn" type="button" id="cancel-add">取消</button><button class="btn pri" type="submit">添加</button></div>
        </form>
      </section>

      <div id="list"><div class="card"><div class="state">正在加载</div></div></div>
    </main>
  </div>
  <nav class="mbar" id="mbar" aria-label="主导航"></nav>
  <script type="module" src="/assets/accounts.js"></script>
</body>
</html>
