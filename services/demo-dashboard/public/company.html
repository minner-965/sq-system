<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业详情 · 恒兆广场招商系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="frame">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content">
      <a class="back" href="/customers.html">‹ 返回招商客户</a>
      <div class="head">
        <div>
          <h1 id="name">&nbsp;</h1>
          <p id="sub">&nbsp;</p>
        </div>
      </div>

      <div class="banner" id="error" role="alert" hidden>
        <span id="error-text"></span>
        <button class="btn" type="button" id="retry">重新加载</button>
      </div>
      <div class="notice" id="notice" role="status" hidden></div>

      <div class="stack">
        <section class="card" aria-label="基本信息"><div class="ph"><div><h3>基本信息</h3></div></div><div class="pb facts" id="facts"><div class="state">正在加载</div></div></section>
        <div class="cols">
          <div class="stack" id="tracks"></div>
          <div class="stack">
            <section class="card"><div class="ph"><div><h3>需求依据</h3><p>为什么认为这家企业可能有需求，打电话前先看</p></div></div><div class="pb" id="demand"></div></section>
            <section class="card"><div class="ph"><div><h3>评分</h3><p>各板块的候选分数和依据</p></div></div><div class="pb" id="scores"></div></section>
            <section class="card"><div class="ph"><div><h3>跟进记录</h3><p>最近的在前</p></div></div><div class="pb" id="timeline"></div></section>
          </div>
        </div>
      </div>
    </main>
  </div>
  <dialog class="sheet" id="call" aria-labelledby="call-title">
    <div class="sheet-head"><h3 id="call-title">打电话并记录</h3><button class="btn sm" type="button" id="call-close">关闭</button></div>
    <form class="sheet-body" id="call-form">
      <p class="call-number" id="call-number"></p>
      <div id="call-ask"></div>
      <fieldset class="field"><legend>打完以后：对方有没有需求</legend>
        <div class="demand-check" id="call-result">
          <label class="check"><input type="radio" name="result" value="confirmed" required>确有需求</label>
          <label class="check"><input type="radio" name="result" value="later">以后可能有</label>
          <label class="check"><input type="radio" name="result" value="none">没有需求</label>
          <label class="check"><input type="radio" name="result" value="unreachable">没联系上</label>
        </div>
      </fieldset>
      <div class="field"><label for="call-note">对方怎么说的（选填）</label><textarea id="call-note" name="note" maxlength="300" rows="3"></textarea></div>
      <div class="field"><label for="call-next">下次跟进时间（选填）</label><input type="datetime-local" id="call-next" name="next"></div>
      <label class="check" id="call-stage-row"><input type="checkbox" name="advance" checked> 联系上了就把阶段改为“已联系”</label>
      <div class="form-actions"><span class="form-error" id="call-error" role="alert"></span><button class="btn pri" type="submit">记下来</button></div>
    </form>
  </dialog>
  <dialog class="sheet" id="record" aria-labelledby="record-title">
    <div class="sheet-head"><h3 id="record-title">跟进记录</h3><button class="btn sm" type="button" id="record-close">关闭</button></div>
    <div class="sheet-body" id="record-body"></div>
  </dialog>
  <nav class="mbar" id="mbar" aria-label="主导航"></nav>
  <script type="module" src="/assets/company.js"></script>
</body>
</html>
