<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招商客户 · 恒兆广场招商系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="frame">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content">
      <div class="head">
        <div>
          <h1>招商客户</h1>
          <p>复核通过的企业在这里跟进，按下次跟进时间排序</p>
        </div>
      </div>

      <div class="banner" id="error" role="alert" hidden>
        <span id="error-text"></span>
        <button class="btn" type="button" id="retry">重新加载</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="跟进阶段" id="tabs"></div>
          <div class="btns">
            <label class="toggle"><input type="checkbox" id="mine">只看我负责的</label>
            <label class="search inline">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="search" id="q" placeholder="按企业名称筛选" aria-label="筛选">
            </label>
          </div>
        </div>
        <div id="list"><div class="state">正在加载</div></div>
        <div class="more" id="more" hidden><button class="btn" type="button" id="load-more">再看 50 家</button></div>
      </div>
    </main>
  </div>
  <nav class="mbar" id="mbar" aria-label="主导航"></nav>
  <script type="module" src="/assets/customers.js"></script>
</body>
</html>
