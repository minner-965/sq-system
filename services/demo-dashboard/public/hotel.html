<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒店资料 · 恒兆广场招商系统</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="frame">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content">
      <div class="head">
        <div>
          <h1>酒店资料</h1>
          <p>这里的房价是可以告诉客户的价格。写酒店内容、起草咨询回复时照这里的价格写；没填价格的房型只说欢迎咨询。</p>
        </div>
      </div>

      <div class="banner" id="error" role="alert" hidden>
        <span id="error-text"></span>
        <button class="btn" type="button" id="retry">重新加载</button>
      </div>
      <div class="notice" id="notice" role="status" hidden></div>

      <div id="hotels"><div class="card"><div class="state">正在加载</div></div></div>
    </main>
  </div>
  <nav class="mbar" id="mbar" aria-label="主导航"></nav>
  <script type="module" src="/assets/hotel.js"></script>
</body>
</html>
